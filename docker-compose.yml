# FestHub: the whole platform in Docker.
#
#   cp docker.env.example .env        # then edit the two secrets
#   docker compose up -d --build      # MongoDB + API + web (http://localhost:8080) + self-hosted Judge0
#   docker compose --profile tools run --rm seed     # optional: demo accounts and sample data
#
# Services:
#   web     nginx: serves the React build and proxies /api, /socket.io and /uploads to `server` (one public origin)
#   server  Express API + Socket.IO. Uploaded event images live in the `uploads` volume.
#   mongo   MongoDB 7 (bound to 127.0.0.1 only)
#   judge0-* self-hosted code judge (needs `privileged`). Linux/WSL2 recommended; see docs/LOCAL_JUDGE0_BN.md for cgroup issues.
#           Don't need programming contests? Remove the judge0-* services and set JUDGE_ADAPTER=... in your own environment.
services:
  web:
    build: { context: ., dockerfile: docker/Dockerfile.web, args: { VITE_SHOW_DEMO: '${VITE_SHOW_DEMO:-true}' } }
    restart: unless-stopped
    ports: ['${WEB_PORT:-8080}:80']
    depends_on:
      server: { condition: service_healthy }

  server:
    build: { context: ., dockerfile: docker/Dockerfile.server, target: runtime }
    restart: unless-stopped
    environment: &server_env
      NODE_ENV: production
      PORT: '5000'
      MONGODB_URI: mongodb://mongo:27017/festhub
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?Set JWT_ACCESS_SECRET in .env (see docker.env.example)}
      QR_TOKEN_SECRET: ${QR_TOKEN_SECRET:?Set QR_TOKEN_SECRET in .env (see docker.env.example)}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      # Plain-http local setup: first-party cookie. For HTTPS deployments set COOKIE_SECURE=true and COOKIE_SAMESITE=lax (same origin) or none (split origins).
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      UPLOAD_DIR: /data/uploads
      # Optional e-mail for notifications; empty SMTP_HOST = disabled
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      APP_URL: ${CLIENT_ORIGIN:-http://localhost:8080}
      MAX_IMAGE_MB: ${MAX_IMAGE_MB:-5}
      JUDGE_ADAPTER: judge0
      JUDGE0_BASE_URL: http://judge0-server:2358
    volumes: ['uploads:/data/uploads']
    depends_on: [mongo]

  # One-off: docker compose --profile tools run --rm seed
  seed:
    profiles: ['tools']
    build: { context: ., dockerfile: docker/Dockerfile.server, target: build }
    environment:
      <<: *server_env
      NODE_ENV: development
    working_dir: /app/apps/server
    command: ['npm', 'run', 'seed']
    depends_on: [mongo]

  mongo:
    image: mongo:7
    restart: unless-stopped
    ports: ['127.0.0.1:27017:27017']
    volumes: ['mongo_data:/data/db']

  judge0-server:
    image: judge0/judge0:1.13.1
    restart: unless-stopped
    ports: ['127.0.0.1:2358:2358']
    privileged: true
    env_file: ./judge0.conf
    depends_on: [judge0-db, judge0-redis]

  judge0-workers:
    image: judge0/judge0:1.13.1
    command: ['./scripts/workers']
    restart: unless-stopped
    privileged: true
    env_file: ./judge0.conf
    depends_on: [judge0-db, judge0-redis]

  judge0-db:
    image: postgres:16.2
    restart: unless-stopped
    env_file: ./judge0.conf
    volumes: ['judge0_pg:/var/lib/postgresql/data']

  judge0-redis:
    image: redis:7.2.4
    restart: unless-stopped
    env_file: ./judge0.conf
    command: ['bash', '-c', 'docker-entrypoint.sh --appendonly no --requirepass "$$REDIS_PASSWORD"']

volumes:
  mongo_data:
  judge0_pg:
  uploads:
