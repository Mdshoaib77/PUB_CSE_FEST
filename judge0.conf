# Local-only Judge0 settings (ports of db/redis are NOT published to your machine).
RAILS_ENV=production
REDIS_HOST=judge0-redis
REDIS_PASSWORD=local-redis-pass
POSTGRES_HOST=judge0-db
POSTGRES_DB=judge0
POSTGRES_USER=judge0
POSTGRES_PASSWORD=local-pg-pass
# Hard caps (the per-problem limits from FestHub must be <= these)
MAX_CPU_TIME_LIMIT=15
MAX_MAX_CPU_TIME_LIMIT=15
MAX_MEMORY_LIMIT=512000
MAX_MAX_MEMORY_LIMIT=512000
ENABLE_WAIT_RESULT=true
# cgroup v2 workaround: run the sandbox without cgroups
ENABLE_PER_PROCESS_AND_THREAD_TIME_LIMIT=true
ENABLE_PER_PROCESS_AND_THREAD_MEMORY_LIMIT=true